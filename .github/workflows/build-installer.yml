name: Build Installer

# Produces BubbsySearchSetup.exe on GitHub's Windows runners so nobody needs a
# compiler. Runs on every push to main (uploads an artifact you can download from
# the run) and, when you push a version tag like v0.1.0, publishes it to Releases.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create Releases

env:
  EVERYTHING_VERSION: "1.4.1.1032"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Stage bundled Everything (portable)
        shell: pwsh
        run: |
          $url = "https://www.voidtools.com/Everything-$env:EVERYTHING_VERSION.x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile everything.zip
          New-Item -ItemType Directory -Force -Path third_party/everything | Out-Null
          Expand-Archive -Path everything.zip -DestinationPath third_party/everything -Force
          Get-ChildItem third_party/everything

      - name: Configure & build (Release)
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\bubbsy-search.iss
          Get-ChildItem installer\Output

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubbsySearchSetup
          path: installer/Output/BubbsySearchSetup.exe
          if-no-files-found: error

      - name: Publish to Releases (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/BubbsySearchSetup.exe
          generate_release_notes: true
